        short_cents:
          description: iccard_topup_required：IC 卡还差多少，萨当
          type: integer
        source:
          description: 谁触发的：user 手机端、kiosk 柜机、device 设备上报、admin 管理员、job 定时任务、callback
            支付回调；slot_selected、slot_confirmed、payment_method_selected、order_created、bucket_countdown、dispense_start_failed、dispense_progress、dispense_paused、dispense_resumed
            带
