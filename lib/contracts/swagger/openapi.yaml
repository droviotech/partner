          type: string
        order_status:
          description: session_ended：cause 为 order_ended 时带，这单结束时的订单状态，同订单详情的 status
          type: string
        paid_cents:
          description: payment_succeeded：本次实付，萨当，免费打水与套餐额度全额抵扣时为 0
          type: integer
        pause_count:
          description: dispense_paused：这是第几次暂停
          type: integer
        pause_limit:
          description: dispense_paused：单次取水的暂停次数上限，取 business.pause_limit，与会话快照的 pause_limit
            相同
          type: integer
        pay_attempt:
          description: payment_method_selected：建单后切换支付方式时才带，第几次发起支付
          type: integer
        payment_method:
          description: payment_method_selected：支付方式，line_pay、alipay、wechat_pay、iccard；C
            端选余额支付与余额补差支付时也是 line_pay
          type: string
        picture_url:
          description: session_joined：扫码用户的头像地址，柜机屏幕展示用；查询失败时该字段不出现
          type: string
        reason:
          description: order_cancelled：取消原因；session_ended：建单前会话结束的中文说明，如「柜机重新开始」「用户退出」「选档位超时」，前端判断用
            cause
          type: string
        refund_cents:
          description: dispense_finished：少出水退回的金额，萨当，不含套餐额度
          type: integer
        refund_total_cents:
          description: dispense_finished：已结算时带；session_ended：cause 为 order_ended 时带。这单的退款合计，萨当，套餐额度退回加实付退回（含在途的渠道退款），结果页的退款金额显示它
          type: integer
        result_confirming:
          description: dispense_finished：为 true 表示出水结果迟迟未回，订单转「出水结果确认中」等人工确认，此时不带
            actual_volume_ml 与 refund_cents
