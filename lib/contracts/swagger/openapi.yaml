        total_cents:
          description: 可用余额，萨当
          type: integer
        used_cents:
          description: 已使用，萨当，= 还在队列里的各批次总额 − 剩余，取水消费与管理员扣除都算，已退款套餐不计
          type: integer
      type: object
    handler.WarehouseAdminCandidate:
      properties:
        id:
          description: 账号 ID
          type: integer
        name:
          description: 姓名
          type: string
        phone:
          description: 联系电话，未填写为空
          type: string
        warehouse_codes:
          description: 当前绑定的仓库编号列表
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    handler.WarehouseAdminItem:
      properties:
        address_detail:
          description: 详细地址
          type: string
        code:
          description: 仓库编号，形如 WH-001
          type: string
        created_at:
          description: 创建时间，RFC3339
          type: string
        id:
          description: 仓库 ID
          type: integer
        managers:
          description: 绑定的启用管理员
          items:
            $ref: '#/components/schemas/handler.WarehouseManagerItem'
          type: array
          uniqueItems: false
        name:
          description: 仓库名称
          type: string
        region_code:
          description: 所在区域，地区字典县/区一级代码
          type: string
        remark:
          description: 备注
          type: string
        status:
          description: enabled 启用，disabled 停用
          enum:
          - enabled
          - disabled
          type: string
      type: object
    handler.WarehouseAdminListResponse:
      properties:
        items:
          description: 当页数据
          items:
            $ref: '#/components/schemas/handler.WarehouseAdminItem'
          type: array
          uniqueItems: false
        total:
          description: 总条数
          type: integer
      type: object
    handler.WarehouseAdminSaveRequest:
      properties:
        address_detail:
          description: 详细地址，不含区域部分
          type: string
        admin_ids:
          description: 仓库管理员的账号 ID，整体替换，可空（首个仓库创建时可能还没有仓管账号）
          items:
            type: integer
          type: array
          uniqueItems: false
        name:
          description: 仓库名称
          type: string
        region_code:
          description: 所在区域，地区字典县/区一级代码
          type: string
        remark:
          description: 备注，可选
          type: string
      required:
      - address_detail
      - name
      - region_code
      type: object
    handler.WarehouseAdminStatusRequest:
      properties:
        status:
          description: 目标状态
          enum:
          - enabled
          - disabled
          type: string
      required:
      - status
      type: object
    handler.WarehouseAdminsResponse:
      properties:
        items:
          description: 候选账号，全量不分页
          items:
            $ref: '#/components/schemas/handler.WarehouseAdminCandidate'
          type: array
          uniqueItems: false
      type: object
    handler.WarehouseManagerItem:
      properties:
        id:
          description: 账号 ID
          type: integer
        name:
          description: 姓名
          type: string
        phone:
          description: 联系电话，未填写为空
          type: string
      type: object
    handler.WasteWaterAdminDaily:
      properties:
        date:
          description: YYYY-MM-DD
          type: string
        usage_milli:
          description: 当日有效最终会话废水量，千分之一升；无数据为 null
          type: integer
          x-nullable: true
      type: object
    handler.WasteWaterAdminItem:
      properties:
        cumulative_usage_milli:
          description: 新口径上线后所有有效最终会话的累计废水量，千分之一升
          type: integer
        device_id:
          description: 设备主键
          type: integer
        device_model:
          description: 设备型号，设备已删除时为空
          type: string
        device_name:
          description: 设备名称，设备已删除时为空
          type: string
        device_region:
          description: 设备所在区域，「府 / 县区」形式
          type: string
        device_region_code:
          description: 设备所在区域的县/区 code，筛选回填用
          type: string
        device_sn:
          description: 设备编码
          type: string
        id:
          type: integer
        last_report_at:
          description: 最近一次最终会话上报时间，RFC3339；未上报为空
          type: string
        latest_usage_milli:
          description: 最近一次有效最终会话的废水量，千分之一升；未采集为 null
          type: integer
          x-nullable: true
        range_usage_milli:
          description: 区间有效最终会话废水量，千分之一升；无数据为 null
          type: integer
          x-nullable: true
      type: object
    handler.WasteWaterAdminListResponse:
      properties:
        daily:
          description: include_daily=true 时固定近 7 日
          items:
            $ref: '#/components/schemas/handler.WasteWaterAdminDaily'
          type: array
          uniqueItems: false
        items:
          description: 当页数据
          items:
            $ref: '#/components/schemas/handler.WasteWaterAdminItem'
          type: array
          uniqueItems: false
        summary:
          $ref: '#/components/schemas/handler.WasteWaterAdminSummary'
          description: include_daily=true 时的区间汇总
        total:
          description: 总条数
          type: integer
      type: object
    handler.WasteWaterAdminReadingItem:
      properties:
        id:
          description: 流水主键
          type: integer
        read_at:
          description: 最终会话首次观测时间，RFC3339
          type: string
        report_id:
          description: 设备侧上报 ID
          type: string
        session_generation:
          description: 会话所属板端上电世代
          type: integer
          x-nullable: true
        session_id:
          description: 会话序号 D7
          type: integer
          x-nullable: true
        session_pulses:
          description: 会话 FLOW3 脉冲增量 D8
          type: integer
          x-nullable: true
        session_pulses_per_liter:
          description: 会话冻结流量系数 DC，脉冲/升
          type: integer
          x-nullable: true
        session_raw_milli:
          description: 会话原始毫升 D9，即使无效也保留
          type: integer
          x-nullable: true
        session_state:
          description: 会话状态 DA：0 无、1 运行中、2 结束或中止
          type: integer
          x-nullable: true
        session_valid:
          description: 会话有效标志 DB
          type: boolean
          x-nullable: true
        usage_milli:
          description: 本次最终会话废水量，千分之一升；无效会话为 null
          type: integer
          x-nullable: true
      type: object
    handler.WasteWaterAdminReadingListResponse:
      properties:
        items:
          description: 当页上报流水
          items:
            $ref: '#/components/schemas/handler.WasteWaterAdminReadingItem'
          type: array
          uniqueItems: false
        meter:
          $ref: '#/components/schemas/handler.WasteWaterAdminItem'
          description: 设备当前值与本次筛选区间统计
        total:
          description: 总条数
          type: integer
      type: object
    handler.WasteWaterAdminSummary:
      properties:
        usage_milli:
          description: 区间有效最终会话废水量，千分之一升；无数据为 null
          type: integer
          x-nullable: true
      type: object
