        device_address:
          description: 取水点地址；可见范围同 device_name，设备未填地址时也为空
          type: string
        device_id:
          description: 设备 ID，查柜机详情用
          type: integer
        device_name:
          description: 设备名称；只有订单列表、详情与进行中查询带它，支付与出水这些动作类响应里为空
          type: string
        device_sn:
          description: 设备 SN
          type: string
        dispense_end_reason:
          description: 出水结束原因：user_stop 用户停止，kiosk_finish 柜机自认放完，pause_timeout 暂停超时，device_fault
            设备故障中断，manual_confirm 出水结果迟迟未回传、由人工确认出水量，user_cancel 用户在放桶页取消，bucket_timeout
            放桶超时，no_flow 开始出水后一滴没出；user_stop、pause_timeout、device_fault 在订单转 result_confirming
            时即有值，柜机上报或人工确认后沿用；已开始出水而结算出水量为 0 的一律为 no_flow；未结算且没转确认中为 none
          enum:
          - none
          - user_stop
          - kiosk_finish
          - pause_timeout
          - device_fault
          - manual_confirm
          - user_cancel
          - bucket_timeout
          - no_flow
          type: string
        dispense_result:
          description: full 完整出水，partial 部分出水，none 未出水：还没结算，或结算时出水量为 0（如放桶页取消、放桶超时），结没结算看
            status
          enum:
          - none
          - full
          - partial
          type: string
        dispense_started_at:
          description: 开始出水时间，RFC3339，未开始为空
          type: string
        display_status:
          description: C 端展示状态：completed 已完成（含退过款的单），processing 处理中，cancelled 已取消；待支付为空。小程序订单列表的展示与筛选都按它
          enum:
          - completed
          - processing
          - cancelled
          type: string
        due_cents:
          description: 应付金额，萨当：已完成的单按实际出水量计（= 订单金额 − 少出水退差），未结算的同订单金额，已取消为 0；售后退款不计入
          type: integer
        estimated_refund_cents:
          description: 按当前已出水量预估的退款合计，萨当，套餐额度退回与实付退回合起来与结算同一公式；只在出水中输出，出满或离开出水中后为
            0
          type: integer
        id:
          type: integer
        interaction_started_at:
          description: 用户首次选择档位时间，RFC3339，旧订单或未知为空
          type: string
        order_no:
          description: 订单号
          type: string
        paid_at:
          description: 支付时间，未支付为空
          type: string
        paid_cents:
          description: 实付金额，萨当，只含渠道与 IC 卡收的钱，不含余额抵扣
          type: integer
        pause_count:
          description: 已暂停次数，达上限后暂停入口不可用
          type: integer
        paused:
          description: 当前是否处于暂停中
          type: boolean
        payment_method:
          description: 支付方式，quota 为余额支付（套餐余额全额抵扣）；管理端列表按 topup 筛选时固定为「补差」
          enum:
          - line_pay
          - alipay
          - wechat_pay
          - iccard
          - free
          - quota
          type: string
        pays:
          description: 付款明细，与订单详情同一结构：套餐余额、IC 卡与在线渠道三类，按此顺序，金额之和等于 actual_paid_cents，没付过款时为空数组
          items:
            $ref: '#/components/schemas/handler.OrderPayItem'
          type: array
          uniqueItems: false
        pending_refund_cents:
          description: 还没退成的渠道退款金额合计，萨当，受理中与待重试的都算在内
          type: integer
        price_per_liter_cents:
          description: 单价快照，萨当每升
          type: integer
        quota_deducted_cents:
          description: 已抵扣的套餐额度，萨当
          type: integer
        quota_paid_cents:
          description: 付款时抵扣的余额，萨当，三个池合计，退款后不变
          type: integer
        quota_refunded_cents:
          description: 已退回套餐余额的额度，萨当，取消、少出水与售后退款都算
          type: integer
        refund_progress:
          description: 退款状态，渠道、IC 卡与套餐余额三类合起来：none 无退款，pending 退款处理中，failed 退款失败、系统仍在重试，succeeded
            已退款；页面上的「退款状态」显示它，refund_status 只反映渠道那部分
          enum:
          - none
          - pending
          - failed
          - succeeded
          type: string
        refund_status:
          description: 渠道退款进度汇总：none 没退过，pending 退款中，succeeded 已退出，failed 待重试；逐笔进度看详情里的
            refunds
          enum:
          - none
          - pending
          - succeeded
          - failed
          type: string
        refunded_cents:
          description: 已退实付金额，萨当；净收 = paid_cents - refunded_cents
          type: integer
        selected_volume_ml:
          description: 选择的档位水量
          type: integer
        session_id:
          description: 所属取水会话，事件频道与快照都认它；补建的离线订单为空
          type: string
        status:
          description: pending_payment 待支付，paid_dispensing 已支付取水中，result_confirming
            出水结果确认中，completed 已完成，cancelled 已取消
          enum:
          - pending_payment
          - paid_dispensing
          - result_confirming
          - completed
          - cancelled
          type: string
        total_cents:
          description: 订单金额，萨当，按选择的水量计，少出水结算后不变
          type: integer
        trade_no:
          description: 当前商户单号，改过支付方式的单从第二次起带 -P<n> 后缀，IC 卡补差单带 -T；测试页拿它触发 mock 支付成功
          type: string
        water_type:
          description: pure 纯水，mineral 矿化水
          type: string
      type: object
    handler.SessionPaymentResponse:
      properties:
        expires_at:
          description: 付款有效期，RFC3339，无有效期为空
