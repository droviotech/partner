components:
  schemas:
    errs.Error:
      properties:
        code:
          type: string
        details: {}
        message:
          type: string
      type: object
    handler.AftersaleAdminApplyRequest:
      properties:
        order_no:
          description: 关联的取水订单号
          maxLength: 32
          type: string
        reason:
          description: 申请原因
          maxLength: 500
          type: string
        refund_paid_cents:
          description: 要退的实付，萨当；只退余额时填 0
          minimum: 0
          type: integer
        refund_quota_cents:
          description: 要退的额度，萨当
          minimum: 0
          type: integer
        type:
          description: 售后类型
          enum:
          - partial_refund
          - quota_refund
          - full_refund
          type: string
      required:
      - order_no
      - type
      type: object
    handler.AftersaleAdminRejectRequest:
      properties:
        reason:
          description: 驳回原因，会展示给用户
          maxLength: 500
          type: string
      required:
      - reason
      type: object
    handler.AftersaleItem:
      properties:
        actual_refunded_cents:
          description: 本单退款合计，萨当，= refund_paid_cents + refund_quota_cents；页面上的「退款金额」显示它
          type: integer
        aftersale_no:
          description: 售后单号，AS 前缀
          type: string
        applicant_id:
          description: 申请人员工 ID，applicant_type 非 staff 时为 0
          type: integer
        applicant_name:
          description: 申请人，仅管理端返回：员工为账号名，用户为昵称，system 与 unknown 为「系统自动」；账号已删除为空
          type: string
        applicant_type:
          description: 申请人类型：staff 员工，user 用户自助，system 少出水自动建单，unknown 存量单未记录
          enum:
          - staff
          - user
          - system
          - unknown
          type: string
        apply_count:
          description: 申请次数，首次申请为 1，驳回后在原单上每重提一次加 1
          type: integer
        apply_reason:
          description: 申请原因
          type: string
        approved_at:
          description: 审批时间，未审批为空
          type: string
        completed_at:
          description: 完成时间，未完成为空
          type: string
        created_at:
          description: 发起时间，RFC3339
          type: string
        error_message:
          description: 退款失败原因，未失败为空
          type: string
        id:
          type: integer
        is_auto:
          description: 是否自动售后，不进人工审批链；少出水与套餐退款为真
          type: boolean
        operator_id:
          description: 审批人 ID，未审批为 0
          type: integer
        operator_name:
          description: 审批人姓名，仅管理端返回；未审批或账号已删除为空
          type: string
        order:
          $ref: '#/components/schemas/handler.AftersaleOrderInfo'
          description: 关联的取水订单，order_type 非 water 或订单已不存在时为 null
        order_no:
          description: 关联的订单号
          type: string
        order_type:
          description: 关联订单类型：water 取水订单，package 套餐订单
          enum:
          - water
          - package
          type: string
        package_order:
          $ref: '#/components/schemas/handler.AftersalePackageOrderInfo'
          description: 关联的套餐订单，order_type 非 package 或订单已不存在时为 null
        refund_paid_cents:
          description: 退回实付，萨当；少出水自动售后为结算时实退的实付，含渠道与 IC 卡
          type: integer
        refund_quota_cents:
          description: 退回额度，萨当；少出水自动售后为结算时实退的额度
          type: integer
        reject_reason:
          description: 驳回原因，未驳回为空
          type: string
        retry_count:
          description: 退款重试次数，审批通过后退款被驱动的次数，与申请次数无关
          type: integer
        status:
          description: pending 待审核，rejected 已驳回，refunding 退款中，completed 已完成，failed
            退款失败
          enum:
          - pending
          - rejected
          - refunding
          - completed
          - failed
          type: string
        type:
          description: partial_refund 部分退款，quota_refund 退额度，full_refund 全额退款
          enum:
          - partial_refund
          - quota_refund
          - full_refund
          type: string
      type: object
    handler.AftersaleListResponse:
      properties:
        items:
          description: 当页数据
          items:
            $ref: '#/components/schemas/handler.AftersaleItem'
          type: array
          uniqueItems: false
        total:
          description: 总条数
          type: integer
      type: object
    handler.AftersaleOrderInfo:
      properties:
        actual_paid_cents:
          description: 实际支付金额，萨当，= paid_cents + quota_paid_cents，退款后不变
          type: integer
        actual_refunded_cents:
          description: 已退金额合计，萨当，= refunded_cents + quota_refunded_cents，与 actual_paid_cents
            对应，口径同取水订单列表
          type: integer
        actual_volume_ml:
          description: 实际出水量，毫升
          type: integer
        created_at:
          description: 下单时间，RFC3339
          type: string
        device_address:
          description: 设备地址
          type: string
        device_name:
          description: 设备名称
          type: string
        device_sn:
          description: 设备 SN
          type: string
        dispense_result:
          description: full 完整出水，partial 部分出水，none 未出水（未结算或出水量为 0）
          enum:
          - none
          - full
          - partial
          type: string
        due_cents:
          description: 应付金额，萨当，口径同取水订单详情：已完成的单按实际出水量计，未结算的同订单金额，已取消为 0
          type: integer
        id:
          description: 订单 ID
          type: integer
        order_no:
          description: 订单号
          type: string
        paid_cents:
          description: 实付金额，萨当，只含渠道与 IC 卡收的钱，不含余额抵扣
          type: integer
        payment_method:
          description: 支付方式，quota 为余额支付；IC 卡补差单是 iccard、余额补差单是 line_pay，展示用 payment_method_text
          enum:
          - line_pay
          - alipay
          - wechat_pay
          - iccard
          - free
          - quota
          type: string
        payment_method_text:
          description: 支付方式的展示文案，与取水订单详情一致：补差订单为「补差」，其余为 LINE Pay、支付宝、微信支付、IC 卡、免费打水、套餐抵扣
          type: string
        price_per_liter_cents:
          description: 单价快照，萨当每升
          type: integer
        quota_deducted_cents:
          description: 套餐抵扣额，萨当
          type: integer
        quota_paid_cents:
          description: 付款时抵扣的余额，萨当，三个池合计，退款后不变
          type: integer
        quota_refunded_cents:
          description: 已退回套餐余额的额度，萨当，取消、少出水与售后退款都算
          type: integer
        refunded_cents:
          description: 已退实付金额，萨当，已出账的渠道与 IC 卡退款，不含退回余额的部分
          type: integer
        selected_volume_ml:
          description: 请求出水量，毫升
          type: integer
        status:
          description: 订单状态
          enum:
          - pending_payment
          - paid_dispensing
          - result_confirming
          - completed
          - cancelled
          type: string
        user_code:
          description: User ID，游客订单没有归属用户，为空
          type: string
        user_name:
          description: 用户昵称
          type: string
        water_type:
          description: pure 纯水，mineral 矿化水
          type: string
      type: object
    handler.AftersalePackageOrderInfo:
      properties:
        consumed_gift_cents:
          description: 已消耗的赠送额度，萨当
          type: integer
        consumed_quota_cents:
          description: 已消耗的购买额度，萨当
          type: integer
        created_at:
          description: 下单时间，RFC3339
          type: string
        gift_cents:
          description: 赠送额度，萨当
          type: integer
        order_no:
          description: 订单号
          type: string
        package_name:
          description: 套餐名称，下单时快照
          type: string
        paid_cents:
          description: 渠道实际到账金额，萨当
          type: integer
        payment_method:
          description: 支付方式
          enum:
          - line_pay
          - alipay
          - wechat_pay
          type: string
        price_cents:
          description: 套餐价格，萨当
          type: integer
        quota_cents:
          description: 购买额度，萨当
          type: integer
        refund_cents:
          description: 应退回渠道的金额，萨当
          type: integer
        refund_status:
          description: 渠道退款状态：pending 在途，succeeded 已出账，failed 失败等重试
          enum:
          - none
          - pending
          - succeeded
          - failed
          type: string
        refunded_at:
          description: 退款出账时间，RFC3339，未出账为空
          type: string
        status:
          description: 订单状态
          enum:
          - pending_payment
          - paid
          - refunding
          - refunded
          - cancelled
          type: string
        user_code:
          description: User ID
          type: string
        user_name:
          description: 用户昵称
          type: string
      type: object
    handler.AftersalePackageRefundResponse:
      properties:
        consumed_cents:
          description: 本单已消耗的购买额度，萨当
          type: integer
        display_status:
          description: C 端展示状态，同套餐订单详情：completed、refund_processing、refunded、refund_failed
          type: string
        ongoing_order_nos:
          description: 用过本单额度、还没结算的取水订单号，有值时不可退，可空
          items:
            type: string
          type: array
          uniqueItems: false
        order_no:
          description: 套餐订单号
          type: string
        package_gifted_cents:
          description: 退款后要回收的套餐赠送额度 = 本单赠送 − 本单已消耗赠送，萨当，管理端赠送额度不在其中
          type: integer
        paid_cents:
          description: 实付金额，萨当
          type: integer
        refund_cents:
          description: 可退金额 = 本单购买额度 − 本单已消耗，萨当
          type: integer
        refund_fail_reason:
          description: 退款失败原因，面向用户的说明，只在 refund_status 为 failed 时有值
          type: string
        refund_status:
          description: 渠道退款进度：none 未退款、pending 受理中、succeeded 已出账、failed 失败
          type: string
        refundable:
          description: 为假时申请入口应置灰
          type: boolean
        status:
          description: 套餐订单状态：paid 已支付、refunding 退款中、refunded 已退款
          type: string
      type: object
    handler.AftersaleStatsResponse:
      properties:
        completed_count:
          description: 已完成
          type: integer
        failed_count:
          description: 退款失败
          type: integer
        refunding_count:
          description: 退款中
          type: integer
        total_refund_cents:
          description: 退款总额，萨当，只计已完成的单
          type: integer
      type: object
    handler.AlarmAdminHandleFilter:
      properties:
        created_from:
          description: 触发日期起，YYYY-MM-DD，含当天，可空
          type: string
        created_to:
          description: 触发日期止，YYYY-MM-DD，含当天，可空
          type: string
        keyword:
          description: 按设备编码或名称模糊匹配，可空
          type: string
        region:
          description: 按设备地区 code 前缀匹配，府两位、县/区四位，可空
          type: string
        status:
          description: 处理状态，批量处理固定叠加未处理，筛选已处理、已恢复或已忽略时范围为空
          enum:
          - active
          - recovered
          - handled
          - ignored
          type: string
        type:
          description: 告警类型，可空
          enum:
          - offline
          - no_external_water
          - flow_meter_fault
          - board_offline
          - tds_exceeds
          - tds_mineral_exceeds
          - low_water_level
          - water_level_abnormal
          - water_meter_read_failure
          - electricity_meter_read_failure
          - iccard_sync_failure
          - filter_expiring
          - filter_expired
          type: string
      type: object
    handler.AlarmAdminHandleRequest:
      properties:
        all:
          description: 处理 filter 圈定的全部未处理告警，对应页面的批量处理
          type: boolean
        filter:
          $ref: '#/components/schemas/handler.AlarmAdminHandleFilter'
          description: 批量范围，all 为 true 时生效，字段与记录列表的查询参数同名同义；不传即全部未处理告警
        ids:
          description: 要处理的告警 ID，all 为 true 时不看它；两者都没给由 service 返回 ALARM_TARGET_REQUIRED
          items:
            type: integer
          type: array
          uniqueItems: false
        remark:
          description: 处理备注，可空
          maxLength: 255
          type: string
        status:
          description: handled 已处理，ignored 已忽略
          enum:
          - handled
          - ignored
          type: string
      required:
      - status
      type: object
    handler.AlarmAdminHandleResponse:
      properties:
        affected:
          description: 实际改掉的条数，已被别人处理掉的不计入
          type: integer
      type: object
    handler.AlarmAdminItem:
      properties:
        created_at:
          description: 触发时间，RFC3339
          type: string
        device_id:
          description: 设备主键
          type: integer
        device_model:
          description: 设备型号，设备已删除时为空
          type: string
        device_name:
          description: 设备名称，设备已删除时为空
          type: string
        device_region:
          description: 设备所在区域，「府 / 县区」形式，未配或不在地区字典里时为空
          type: string
        device_region_code:
          description: 设备所在区域的县/区 code，筛选回填用，可空
          type: string
        device_sn:
          description: 设备编码
          type: string
        handle_remark:
          description: 处理备注，可空
          type: string
        handled_at:
          description: 处理时间，RFC3339，未处理为空
          type: string
        handler_id:
          description: 处理人 ID，未处理为 0
          type: integer
        handler_name:
          description: 处理人姓名，账号已删除时为空
          type: string
        id:
          type: integer
        level:
          description: 告警级别：info、warning、error、critical
          type: string
        message:
          description: 告警描述
          type: string
        recovered_at:
          description: 恢复时间，RFC3339，未恢复为空
          type: string
        status:
          description: active 未处理，recovered 已恢复，handled 已处理，ignored 已忽略
          enum:
          - active
          - recovered
          - handled
          - ignored
          type: string
        type:
          description: 告警类型
          type: string
      type: object
    handler.AlarmAdminListResponse:
      properties:
        items:
          description: 当页数据
          items:
            $ref: '#/components/schemas/handler.AlarmAdminItem'
          type: array
          uniqueItems: false
        total:
          description: 总条数
          type: integer
      type: object
    handler.AlarmAdminRuleItem:
      properties:
        enabled:
          description: 是否启用该类告警
          type: boolean
        trigger_work_order:
          description: 触发后是否自动建工单
          type: boolean
        type:
          description: 告警类型
          enum:
          - offline
          - no_external_water
          - flow_meter_fault
          - board_offline
          - tds_exceeds
          - tds_mineral_exceeds
          - low_water_level
          - water_level_abnormal
          - water_meter_read_failure
          - electricity_meter_read_failure
          - iccard_sync_failure
          - filter_expiring
          - filter_expired
          type: string
      required:
      - type
      type: object
    handler.AlarmAdminRuleListResponse:
      properties:
        items:
          description: 12 种告警类型，影响售水的排在前面
          items:
            $ref: '#/components/schemas/handler.AlarmAdminRuleResponse'
          type: array
          uniqueItems: false
      type: object
    handler.AlarmAdminRuleResponse:
      properties:
        affects_sale:
          description: 触发后设备是否不可售水，规则弹窗按它分两组
          type: boolean
        description:
          description: 触发条件说明
          type: string
        enabled:
          description: 是否启用该类告警
          type: boolean
        name:
          description: 中文名
          type: string
        trigger_work_order:
          description: 触发后是否自动建工单
          type: boolean
        type:
          description: 告警类型
          type: string
      type: object
    handler.AlarmAdminRuleSaveRequest:
      properties:
        rules:
          description: 要改的规则，只改传入的类型
          items:
            $ref: '#/components/schemas/handler.AlarmAdminRuleItem'
          minItems: 1
          type: array
          uniqueItems: false
      required:
      - rules
      type: object
    handler.AlarmAdminStatsResponse:
      properties:
        active_total:
          description: 未处理告警合计
          type: integer
        items:
          description: 各类未处理条数，含条数为 0 的类型
          items:
            $ref: '#/components/schemas/handler.AlarmAdminTypeCount'
          type: array
          uniqueItems: false
      type: object
    handler.AlarmAdminTypeCount:
      properties:
        affects_sale:
          description: 触发后设备是否不可售水
          type: boolean
        count:
          description: 未处理条数
          type: integer
        name:
          description: 中文名
          type: string
        type:
          description: 告警类型
          type: string
      type: object
    handler.AssetBorrowerRef:
      properties:
        id:
          description: 借用人账号 ID
          type: integer
        name:
          description: 借用人姓名
          type: string
      type: object
    handler.AssetCodeAdminGenerateRequest:
      properties:
        asset_type:
          description: 资产类型
          enum:
          - cabinet
          - screen
          - filter
          - filter_box
          - water_board
          - android_board
          type: string
        count:
          description: 生成数量，一次最多 1000 个
          maximum: 1000
          minimum: 1
          type: integer
      required:
      - asset_type
      - count
      type: object
    handler.AssetCodeAdminGenerateResponse:
      properties:
        items:
          description: 本次生成的编码，按序号升序
          items:
            $ref: '#/components/schemas/handler.AssetCodeAdminItem'
          type: array
          uniqueItems: false
        total:
          description: 本次生成条数
          type: integer
      type: object
    handler.AssetCodeAdminItem:
      properties:
        asset_type:
          description: 资产类型
          type: string
        code:
          description: 完整编码，形如 SN-G-000001
          type: string
        created_at:
          description: 生成时间，RFC3339
          type: string
        id:
          type: integer
        seq:
          description: 同类型内的序号
          type: integer
        status:
          description: unused 未使用，used 已绑定资产
          enum:
          - unused
          - used
          type: string
        used_at:
          description: 绑定时间，RFC3339，未使用时为空
          type: string
      type: object
    handler.AssetCodeAdminListResponse:
      properties:
        items:
          description: 当页数据
          items:
            $ref: '#/components/schemas/handler.AssetCodeAdminItem'
          type: array
          uniqueItems: false
        total:
          description: 总条数
          type: integer
      type: object
    handler.AssetDictResponse:
      properties:
        consumable_names:
          description: 耗材名称列表
          items:
            type: string
          type: array
          uniqueItems: false
        filter_specs:
          description: 滤芯规格列表
          items:
            type: string
          type: array
          uniqueItems: false
        normal_part_names:
          description: 普通配件名称列表
          items:
            type: string
          type: array
          uniqueItems: false
        part_specs:
          additionalProperties:
            items:
              type: string
            type: array
          description: 高价值配件各类型的规格列表，键为类型枚举值
          type: object
      type: object
    handler.AssetEquipmentAsset:
      properties:
        asset_type:
          description: 资产类型
          type: string
        bound_at:
          description: 最近一次绑定时间，RFC3339，未绑定为空
          type: string
        code:
          description: 资产编码
          type: string
        spec:
          description: 规格型号
          type: string
        status:
          description: 主状态
          type: string
        sub_status:
          description: 二级状态，可空
          type: string
        updated_at:
          description: 更新时间，RFC3339
          type: string
      type: object
    handler.AssetEquipmentDetail:
      properties:
        address:
          description: 详细地址
          type: string
        assets:
          description: 绑定的一物一码资产
          items:
            $ref: '#/components/schemas/handler.AssetEquipmentAsset'
          type: array
          uniqueItems: false
        created_at:
          description: 建档时间，RFC3339
          type: string
        filters:
          description: 滤芯槽位档案
          items:
            $ref: '#/components/schemas/handler.AssetFilterSlot'
          type: array
          uniqueItems: false
        id:
          description: 设备 ID
          type: integer
        model:
          description: 设备型号
          type: string
        name:
          description: 设备名称
          type: string
        ownership:
          description: 归属：self 自营，rental 租赁
          type: string
        region:
          description: 所在区域，地区字典代码
          type: string
